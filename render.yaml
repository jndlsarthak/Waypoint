services:
  - type: web
    name: waypoint-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # 3.12, not 3.13: chroma-hnswlib only ships prebuilt manylinux wheels
      # through cp312. With no cp313 wheel, pip compiles it from source on
      # Render's build machine, which crashed with SIGILL (exit 132) at
      # import time — almost certainly build-machine-specific CPU
      # instructions (e.g. -march=native) baked into that one-off build,
      # unlike the portable prebuilt wheels for 3.9-3.12.
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GROQ_API_KEY
        sync: false
      # Forces torch to use its baseline CPU kernel dispatch instead of
      # auto-detecting AVX2/AVX512 support via CPUID — on some cloud VMs the
      # hypervisor reports support for instructions it doesn't actually
      # execute correctly, which crashes torch with SIGILL (exit 132) the
      # moment it runs a vectorized op (hit this on Render's free tier).
      - key: ATEN_CPU_CAPABILITY
        value: default
      - key: OMP_NUM_THREADS
        value: "1"
      # The ATEN_CPU_CAPABILITY workaround above didn't fix the SIGILL, so
      # get an actual crash location instead of guessing further: Python's
      # faulthandler catches SIGILL too and prints a real stack trace.
      - key: PYTHONFAULTHANDLER
        value: "1"
